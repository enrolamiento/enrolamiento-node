name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Contract in canonical format
        run: node scripts/pull-contract.mjs --from contract/openapi.json && git diff --exit-code contract/
      - run: npm run generate && git diff --exit-code src/generated test/smoke/examples.generated.ts
      - run: npm run typecheck
      - run: npm test
      - name: Smoke test against Prism
        if: matrix.node == 22
        run: npm run test:smoke
      - run: npm run build
